<div class="login-page">
  <div class="login-card card shadow-sm">
    <div class="card-body p-4 p-md-5">
      <div class="text-center mb-4">
        <div class="login-logo mb-3">
          <i class="bi bi-box-seam text-primary" style="font-size:2.5rem;"></i>
        </div>
        <h1 class="h4 fw-bold text-dark">EquipManager</h1>
        <p class="text-muted small">Connectez-vous à votre espace</p>
      </div>

      <div *ngIf="error" class="alert alert-danger alert-sm py-2 d-flex align-items-center gap-2">
        <i class="bi bi-exclamation-circle-fill"></i>
        {{ error }}
      </div>

      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <div class="mb-3">
          <label class="form-label fw-semibold" for="email">Adresse e-mail</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
            <input
              id="email"
              type="email"
              class="form-control"
              formControlName="email"
              placeholder="admin@esn.com"
              [class.is-invalid]="form.get('email')?.invalid && form.get('email')?.touched"
            />
          </div>
          <div class="invalid-feedback d-block"
               *ngIf="form.get('email')?.invalid && form.get('email')?.touched">
            Adresse e-mail invalide.
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label fw-semibold" for="password">Mot de passe</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input
              id="password"
              [type]="showPassword ? 'text' : 'password'"
              class="form-control"
              formControlName="password"
              placeholder="••••••••"
              [class.is-invalid]="form.get('password')?.invalid && form.get('password')?.touched"
            />
            <button class="btn btn-outline-secondary" type="button" (click)="showPassword = !showPassword">
              <i class="bi" [class.bi-eye]="!showPassword" [class.bi-eye-slash]="showPassword"></i>
            </button>
          </div>
          <div class="invalid-feedback d-block"
               *ngIf="form.get('password')?.invalid && form.get('password')?.touched">
            Mot de passe requis.
          </div>
        </div>

        <button
          type="submit"
          class="btn btn-primary w-100 fw-semibold"
          [disabled]="loading"
        >
          <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
          {{ loading ? 'Connexion…' : 'Se connecter' }}
        </button>
      </form>
    </div>
  </div>
</div>

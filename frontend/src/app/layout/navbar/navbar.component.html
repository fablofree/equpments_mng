<header class="topbar">
  <!-- Logo + app name -->
  <div class="d-flex align-items-center gap-2">
    @if (appSettings.settings().logoDataUrl) {
      <img [src]="appSettings.settings().logoDataUrl!"
           alt="Logo" style="height:30px;width:30px;object-fit:contain;border-radius:4px;" />
    }
    <span class="topbar-title">{{ appSettings.settings().appName }}</span>
  </div>

  <!-- User dropdown -->
  <div class="dropdown ms-auto">
    <button class="btn btn-light btn-sm d-flex align-items-center gap-2 dropdown-toggle"
            type="button" data-bs-toggle="dropdown" aria-expanded="false">
      <span class="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center"
            style="width:32px;height:32px;font-size:0.8rem;font-weight:700;flex-shrink:0;">
        {{ initials }}
      </span>
      <span class="d-none d-md-inline">{{ fullName }}</span>
    </button>
    <ul class="dropdown-menu dropdown-menu-end">
      <li>
        <a class="dropdown-item" routerLink="/profile">
          <i class="bi bi-person me-2"></i>Mon profil
        </a>
      </li>
      <li>
        <a class="dropdown-item" routerLink="/settings">
          <i class="bi bi-gear me-2"></i>Paramètres
        </a>
      </li>
      <li><hr class="dropdown-divider"></li>
      <li>
        <button class="dropdown-item text-danger" type="button" (click)="logout()">
          <i class="bi bi-box-arrow-right me-2"></i>Déconnexion
        </button>
      </li>
    </ul>
  </div>
</header>

<header class="topbar">

  <!-- Hamburger — mobile only -->
  <button type="button" class="hamburger-btn d-lg-none"
          (click)="layout.toggle()" aria-label="Ouvrir le menu">
    <span class="hamburger-bar"></span>
    <span class="hamburger-bar"></span>
    <span class="hamburger-bar"></span>
  </button>

  <!-- Logo + app name -->
  <div class="d-flex align-items-center gap-2 topbar-brand">
    @if (appSettings.settings().logoDataUrl) {
      <img [src]="appSettings.settings().logoDataUrl!"
           alt="Logo" class="topbar-logo" />
    }
    <span class="topbar-title">{{ appSettings.settings().appName }}</span>
  </div>

  <!-- User dropdown -->
  <div class="dropdown ms-auto">
    <button class="btn btn-light btn-sm d-flex align-items-center gap-2 dropdown-toggle"
            type="button" data-bs-toggle="dropdown" aria-expanded="false">
      <span class="user-avatar">{{ initials }}</span>
      <span class="d-none d-sm-inline text-truncate" style="max-width:120px;">{{ fullName }}</span>
    </button>
    <ul class="dropdown-menu dropdown-menu-end shadow-sm">
      <li class="d-sm-none px-3 py-2 border-bottom">
        <div class="fw-semibold small">{{ fullName }}</div>
      </li>
      <li>
        <a class="dropdown-item" routerLink="/profile">
          <i class="bi bi-person me-2"></i>Mon profil
        </a>
      </li>
      <li>
        <a class="dropdown-item" routerLink="/settings">
          <i class="bi bi-gear me-2"></i>Paramètres
        </a>
      </li>
      <li><hr class="dropdown-divider"></li>
      <li>
        <button class="dropdown-item text-danger" type="button" (click)="logout()">
          <i class="bi bi-box-arrow-right me-2"></i>Déconnexion
        </button>
      </li>
    </ul>
  </div>

</header>

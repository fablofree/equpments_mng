<header class="topbar">
  <span class="topbar-title">EquipManager</span>

  <div class="dropdown ms-auto">
    <button
      class="btn btn-light btn-sm d-flex align-items-center gap-2 dropdown-toggle"
      type="button"
      data-bs-toggle="dropdown"
      aria-expanded="false"
    >
      <span class="avatar-sm rounded-circle bg-primary text-white d-flex align-items-center justify-content-center"
            style="width:32px;height:32px;font-size:0.8rem;font-weight:700;">
        {{ initials }}
      </span>
      <span class="d-none d-md-inline">{{ fullName }}</span>
    </button>
    <ul class="dropdown-menu dropdown-menu-end">
      <li>
        <a class="dropdown-item" routerLink="/profile">
          <i class="bi bi-person me-2"></i>Mon profil
        </a>
      </li>
      <li><hr class="dropdown-divider"></li>
      <li>
        <button class="dropdown-item text-danger" type="button" (click)="logout()">
          <i class="bi bi-box-arrow-right me-2"></i>Déconnexion
        </button>
      </li>
    </ul>
  </div>
</header>
